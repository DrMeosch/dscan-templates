version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: main
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # Minor and patch bumps come grouped; major bumps arrive as separate pull requests.
    groups:
      github-actions:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
